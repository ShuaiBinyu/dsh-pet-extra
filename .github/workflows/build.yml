name: Build and Release

on:
  push:
    tags:
      - 'v*' # 只有当你推送类似 v1.0.0 这样的 tag 时才会触发

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:${{ matrix.os == 'macos-latest' && 'mac' || 'win' }} -- --publish always