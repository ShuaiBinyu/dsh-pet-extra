name: Build and Release

on:
  push:
    tags:
      - 'v*' # 只有当你推送 v1.0.0 这样的 tag 时才会触发

jobs:
  release:
    permissions:
      contents: write # 允许 Action 写入 Release
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整的 Git 历史

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      # 👇 编译 Mac 版本，并自动上传到 Release
      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 👇 编译 Windows 版本，并自动上传到 Release
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}